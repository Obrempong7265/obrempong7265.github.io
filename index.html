
<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
    body { background:#000; color:#fff; }
    .top-bar { position:fixed; top:0; width:100%; background:#111; padding:10px 15px; display:flex; justify-content:space-between; }
    .login-btn { background:#ff0050; border:none; color:#fff; padding:6px 12px; border-radius:8px; }
    .page { display:none; padding:70px 15px 80px 15px; }
    .page.active { display:block; }
    .bottom-nav { position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; background:#111; padding:10px 0; }
    .nav-btn { background:none; border:none; color:#888; font-size:12px; text-align:center; }
    .nav-btn.active { color:#ff0050; }
    .card { background:#222; padding:15px; margin:10px 0; border-radius:10px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h3>Video City</h3>
    <button class="login-btn" onclick="alert('Login clicked')">Login</button>
  </div>
  
  <div class="page active" id="home">
    <h2>Home</h2>
    <div class="card">Demo Video 1</div>
    <div class="card">Demo Video 2</div>
  </div>
  
  <div class="page" id="upload">
    <h2>Upload</h2>
    <div class="card">Upload form goes here</div>
  </div>
  
  <div class="page" id="studio">
    <h2>Studio</h2>
    <div class="card">Your videos go here</div>
  </div>
  
  <div class="page" id="earnings">
    <h2>Earnings</h2>
    <div class="card">Total: 0 π</div>
  </div>
  
  <div class="page" id="profile">
    <h2>Profile</h2>
    <div class="card">Not logged in</div>
  </div>
  
  <div class="page" id="notifications">
    <h2>Notifications</h2>
    <div class="card">No notifications</div>
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="show('home')">🏠<br>Home</button>
    <button class="nav-btn" onclick="show('upload')">⬆️<br>Upload</button>
    <button class="nav-btn" onclick="show('studio')">🛠️<br>Studio</button>
    <button class="nav-btn" onclick="show('earnings')">💰<br>Earnings</button>
    <button class="nav-btn" onclick="show('profile')">👤<br>Profile</button>
  </div>

  <script>
    function show(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.closest('.nav-btn').classList.add('active');
    }
  </script>
</body>
</html>
