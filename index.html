
<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { background:#000; color:#fff; font-family:Arial; margin:0; }
    .top { background:#111; padding:10px; display:flex; justify-content:space-between; }
    .page { display:none; padding:60px 10px 70px 10px; }
    .page.show { display:block; }
    .nav { position:fixed; bottom:0; width:100%; display:flex; background:#111; }
    .nav button { flex:1; background:none; border:none; color:#888; padding:10px; }
    .nav button.active { color:#ff0050; }
    .card { background:#222; padding:15px; margin:10px 0; border-radius:8px; }
    video { width:100%; border-radius:8px; }
    input, button { width:100%; padding:10px; margin:5px 0; border-radius:5px; border:none; }
    .btn { background:#ff0050; color:#fff; }
  </style>
</head>
<body>
  <div class="top">
    <h3>Video City v25</h3>
  </div>
  
  <!-- HOME -->
  <div class="page show" id="home">
    <h2>Home</h2>
    <div id="feed"></div>
  </div>
  
  <!-- UPLOAD -->
  <div class="page" id="upload">
    <h2>Upload</h2>
    <div class="card">
      <input type="file" id="file" accept="video/*">
      <input id="title" placeholder="Video Title">
      <input id="price" type="number" placeholder="Price in Pi">
      <button class="btn" onclick="upload()">Publish</button>
    </div>
  </div>
  
  <!-- STUDIO -->
  <div class="page" id="studio">
    <h2>Studio</h2>
    <div id="studioList"></div>
  </div>
  
  <!-- PROFILE -->
  <div class="page" id="profile">
    <h2>Profile</h2>
    <div class="card">Guest</div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="nav">
    <button class="active" onclick="go('home')">Home</button>
    <button onclick="go('upload')">Upload</button>
    <button onclick="go('studio')">Studio</button>
    <button onclick="go('profile')">Profile</button>
  </div>

<script>
let videos = [
  {title:"Demo Video", price:1, src:"https://www.w3schools.com/html/mov_bbb.mp4"}
];

function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(page).classList.add('show');
  event.target.classList.add('active');
  if(page=='home') loadFeed();
  if(page=='studio') loadStudio();
}

function loadFeed(){
  let html = '';
  videos.forEach(v=>{
    html += `<div class="card">
      <video src="${v.src}" controls></video>
      <b>${v.title}</b><br>
      Price: ${v.price} π
    </div>`;
  });
  document.getElementById('feed').innerHTML = html;
}

function upload(){
  let t = document.getElementById('title').value;
  let p = document.getElementById('price').value;
  if(!t || !p) return alert('Fill title and price');
  videos.push({title:t, price:p, src:"https://www.w3schools.com/html/mov_bbb.mp4"});
  alert('Published!');
  go('home');
}

function loadStudio(){
  let html = '';
  videos.forEach(v=>{
    html += `<div class="card"><b>${v.title}</b> - ${v.price} π</div>`;
  });
  document.getElementById('studioList').innerHTML = html;
}

loadFeed();
</script>
</body>
</html>
