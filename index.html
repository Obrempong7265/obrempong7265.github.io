

<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
    body { background:#000; color:#fff; }
   .top-bar { position:fixed; top:0; width:100%; background:#111; padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:100; }
   .login-btn { background:#ff0050; border:none; color:#fff; padding:6px 12px; border-radius:8px; }
   .notif-btn { background:none; border:none; color:#fff; font-size:22px; }
   .page { display:none; padding:70px 15px 80px 15px; }
   .page.active { display:block; }
   .bottom-nav { position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; background:#111; padding:10px 0; z-index:100; }
   .nav-btn { background:none; border:none; color:#888; font-size:12px; text-align:center; }
   .nav-btn.active { color:#ff0050; }
   .card { background:#222; padding:15px; margin:10px 0; border-radius:10px; }
   .video-box { background:#222; margin:10px 0; border-radius:10px; overflow:hidden; }
   .video-box video { width:100%; display:block; }
   .form-input { width:100%; padding:10px; margin:8px 0; background:#333; border:1px solid #444; border-radius:8px; color:#fff; }
   .btn { width:100%; padding:12px; background:#ff0050; border:none; color:#fff; border-radius:8px; margin-top:8px; }
   .grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
   .grid-item { aspect-ratio:9/16; background:#222; border-radius:8px; overflow:hidden; }
   .grid-item video { width:100%; height:100%; object-fit:cover; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h3>Video City</h3>
    <div>
      <button class="notif-btn" onclick="show('notifications')">🔔</button>
      <button class="login-btn" onclick="login()">Login</button>
    </div>
  </div>
  
  <!-- HOME -->
  <div class="page active" id="home"><h2>Home</h2><div id="feed"></div></div>
  
  <!-- UPLOAD - NOW WORKING -->
  <div class="page" id="upload">
    <h2>Upload Video</h2>
    <div class="card">
      <input type="file" id="videoFile" accept="video/*" onchange="previewVideo(event)">
      <p id="fileName" style="margin:10px 0; color:#aaa;">No file chosen</p>
      <video id="preview" width="100%" style="display:none; border-radius:10px;" controls></video>
      <input id="videoTitle" class="form-input" placeholder="Video Title">
      <input id="videoPrice" class="form-input" type="number" step="0.1" placeholder="Price in Pi. Ex: 2">
      <button onclick="publishVideo()" class="btn">Publish</button>
    </div>
  </div>
  
  <!-- STUDIO - NOW WORKING -->
  <div class="page" id="studio">
    <h2>Studio</h2>
    <div id="myVideos"></div>
  </div>
  
  <div class="page" id="earnings"><h2>Earnings</h2><div class="card">Earnings: 0 π</div></div>
  
  <div class="page" id="profile">
    <h2>Profile</h2>
    <div class="card" id="profile-user">Not logged in</div>
    <h3>My Videos</h3>
    <div id="myProfileVideos" class="grid"></div>
  </div>
  
  <div class="page" id="notifications"><h2>Notifications</h2><div class="card">No notifications yet</div></div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="show('home')">🏠<br>Home</button>
    <button class="nav-btn" onclick="show('upload')">⬆️<br>Upload</button>
    <button class="nav-btn" onclick="show('studio')">🛠️<br>Studio</button>
    <button class="nav-btn" onclick="show('earnings')">💰<br>Earnings</button>
    <button class="nav-btn" onclick="show('profile')">👤<br>Profile</button>
  </div>

  <script>
    try { Pi.init({ version: "2.0", sandbox: "true" }); } catch(e){ console.log("Pi not loaded") }
    
    let currentUser = "Guest";
    let videos = JSON.parse(localStorage.getItem('videos')) || [
      {id:1, title:"Demo Video", creator:"@creator1", price:1, src:"https://www.w3schools.com/html/mov_bbb.mp4"}
    ];
    let uploadedFileURL = "";
    
    function saveVideos() { localStorage.setItem('videos', JSON.stringify(videos)); }
    
    function show(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.closest('.nav-btn').classList.add('active');
      if(id === 'home') renderFeed();
      if(id === 'studio') renderStudio();
      if(id === 'profile') renderProfile();
    }
    
    function renderFeed() {
      let html = '';
      videos.forEach(v => {
        html += `<div class="video-box">
          <video src="${v.src}" controls></video>
          <div style="padding:10px;"><b>${v.title}</b><br><span style="color:#aaa;">${v.creator} • ${v.price} π</span></div>
        </div>`;
      });
      document.getElementById('feed').innerHTML = html;
    }
    
    function previewVideo(event) {
      const file = event.target.files[0];
      uploadedFileURL = URL.createObjectURL(file);
      document.getElementById('fileName').innerText = file.name;
      document.getElementById('preview').src = uploadedFileURL;
      document.getElementById('preview').style.display = 'block';
    }
    
    function publishVideo() {
      const title = document.getElementById('videoTitle').value;
      const price = parseFloat(document.getElementById('videoPrice').value);
      if(!uploadedFileURL ||!title ||!price) return alert("Fill all fields");
      
      videos.unshift({id:Date.now(), title:title, creator:"@"+currentUser, price:price, src:uploadedFileURL});
      saveVideos(); 
      alert("Published!"); 
      show('home');
    }
    
    function renderStudio() {
      let myVids = videos.filter(v => v.creator === "@"+currentUser);
      let html = '';
      myVids.forEach(v => {
        html += `<div class="card"><b>${v.title}</b><br><span style="color:#aaa;">${v.price} π</span></div>`;
      });
      document.getElementById('myVideos').innerHTML = html || "<div class='card'>You haven't uploaded any videos yet</div>";
    }
    
    function renderProfile() {
      let myVids = videos.filter(v => v.creator === "@"+currentUser);
      let html = '';
      myVids.forEach(v => {
        html += `<div class="grid-item"><video src="${v.src}" muted></video></div>`;
      });
      document.getElementById('myProfileVideos').innerHTML = html || "<p style='padding:10px;'>No videos</p>";
    }
    
    async function login() {
      try {
        const auth = await Pi.authenticate(['username', 'payments']);
        currentUser = auth.user.username;
        document.getElementById("profile-user").innerText = "@" + currentUser;
        alert("Logged in as @" + currentUser);
      } catch(e) { alert("Login failed") }
    }
    
    renderFeed();
  </script>
</body>
</html>
