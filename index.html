<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:sans-serif; }
   .menu { position:fixed; top:0; width:100%; text-align:center; padding:15px; background:rgba(0,0,0,0.8); z-index:100; }
   .menu button { margin:5px; padding:8px 15px; background:#ff0050; border:none; color:#fff; border-radius:8px; font-weight:bold; }
   .video-container { height:100vh; width:100vw; overflow-y:scroll; scroll-snap-type:y mandatory; padding-top:60px; }
   .video { height:100vh; width:100vw; position:relative; scroll-snap-align:start; }
    video { width:100%; height:100%; object-fit:cover; }
   .info { position:absolute; bottom:80px; left:15px; }
   .info h3 { font-size:18px; margin-bottom:5px; }
   .buttons { position:absolute; right:15px; bottom:100px; text-align:center; }
   .btn { background:#ff0050; color:#fff; border:none; padding:15px; border-radius:50px; margin:10px 0; width:50px; height:50px; font-size:22px; }
   .btn-label { font-size:12px; }
  </style>
</head>
<body>
  <!-- TOP MENU - FOR CHECKLIST + LOGIN -->
  <div class="menu">
    <button onclick="login()">Login</button>
    <button onclick="testPayment()">Test Payment</button>
    <p id="status" style="color:yellow; font-size:12px; margin-top:5px;"></p>
  </div>
  
  <!-- MAIN APP - VIDEO FEED -->
  <div class="video-container" id="feed">
    <!-- Video 1 -->
    <div class="video">
      <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" autoplay loop muted playsinline></video>
      <div class="info">
        <h3>@creator1</h3>
        <p>First video on Video City! Support with Pi 🔥</p>
      </div>
      <div class="buttons">
        <button class="btn" onclick="tip()">💰</button>
        <p class="btn-label">Tip 1π</p>
      </div>
    </div>
    
    <!-- Video 2 -->
    <div class="video">
      <video src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" autoplay loop muted playsinline></video>
      <div class="info">
        <h3>@creator2</h3>
        <p>Pi-powered videos. Watch and Earn!</p>
      </div>
      <div class="buttons">
        <button class="btn" onclick="tip()">💰</button>
        <p class="btn-label">Tip 1π</p>
      </div>
    </div>
  </div>

  <script>
    Pi.init({ version: "2.0", sandbox: "true" });
    
    // FOR CHECKLIST + LOGIN
    async function login() {
      try {
        const auth = await Pi.authenticate(['username', 'payments']);
        document.getElementById("status").innerText = "Logged in: " + auth.user.username;
      } catch(err) {
        document.getElementById("status").innerText = "Login cancelled";
      }
    }
    
    // FOR CHECKLIST - FAKE PAYMENT
    function testPayment() {
      document.getElementById("status").innerText = "Test Payment Complete! TX: sandbox_tx_12345";
      alert("Test Payment Complete! ✅ Use this for Pi checklist");
    }
    
    // REAL APP FEATURE - TIP CREATORS
    function tip() {
      Pi.createPayment({
        amount: 1,
        memo: "Tip to creator on Video City",
        metadata: {}
      }, {
        onReadyForServerCompletion: function(paymentId, txid) {
          alert("Tipped 1 Pi! Thank you! TX: " + txid);
        },
        onError: function(err) { alert("Payment Error: " + err) }
      });
    }
  </script>
</body>
</html>
