
<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js" onerror="console.log('Pi failed')"></script>
  <style>
    body { background:#000; color:#fff; font-family:Arial; margin:0; }
   .top { background:#111; padding:10px; display:flex; justify-content:space-between; align-items:center; }
   .login { background:#ff0050; color:#fff; border:none; padding:8px 12px; border-radius:6px; }
   .page { display:none; padding:60px 10px 70px 10px; }
   .page.show { display:block; }
   .nav { position:fixed; bottom:0; width:100%; display:flex; background:#111; }
   .nav button { flex:1; background:none; border:none; color:#888; padding:10px; }
   .nav button.active { color:#ff0050; }
   .card { background:#222; padding:15px; margin:10px 0; border-radius:8px; }
    video { width:100%; border-radius:8px; }
    input, button { width:100%; padding:10px; margin:5px 0; border-radius:5px; border:none; }
   .btn { background:#ff0050; color:#fff; }
   .actions { display:flex; gap:20px; margin-top:5px; }
   .actions button { background:none; color:#fff; width:auto; font-size:20px; }
  </style>
</head>
<body>
  <div class="top">
    <h3>Video City v26</h3>
    <button class="login" onclick="doLogin()">Login</button>
  </div>
  
  <div class="page show" id="home"><h2>Home</h2><div id="feed"></div></div>
  
  <div class="page" id="upload">
    <h2>Upload</h2>
    <div class="card">
      <input type="file" id="file" accept="video/*">
      <input id="title" placeholder="Video Title">
      <input id="price" type="number" step="0.1" placeholder="Price in Pi">
      <button class="btn" onclick="upload()">Publish</button>
    </div>
  </div>
  
  <div class="page" id="studio"><h2>Studio</h2><div id="studioList"></div></div>
  <div class="page" id="profile"><h2>Profile</h2><div class="card" id="user">Not logged in</div></div>

  <div class="nav">
    <button class="active" onclick="go('home')">Home</button>
    <button onclick="go('upload')">Upload</button>
    <button onclick="go('studio')">Studio</button>
    <button onclick="go('profile')">Profile</button>
  </div>

<script>
let currentUser = "Guest";
let videos = [
  {title:"Demo Video", creator:"@system", price:1, likes:0, src:"https://www.w3schools.com/html/mov_bbb.mp4"},
  {title:"Couple", creator:"@OBREMPONG7", price:2, likes:0, src:"https://www.w3schools.com/html/movie.mp4"}
];
let uploadedURL = "";

document.getElementById('file').onchange = function(e){
  let file = e.target.files[0];
  uploadedURL = URL.createObjectURL(file);
}

function go(page){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  document.getElementById(page).classList.add('show');
  event.target.classList.add('active');
  if(page=='home') loadFeed();
  if(page=='studio') loadStudio();
}

function loadFeed(){
  let html = '';
  videos.forEach((v,i)=>{
    html += `<div class="card">
      <video src="${v.src}" controls></video>
      <b>${v.title}</b><br>
      ${v.creator} • Price: ${v.price} π
      <div class="actions">
        <button onclick="like(${i})">❤️ ${v.likes}</button>
        <button onclick="alert('Tip ${v.price} π')">💰</button>
      </div>
    </div>`;
  });
  document.getElementById('feed').innerHTML = html;
}

function like(i){
  videos[i].likes++;
  loadFeed();
}

function upload(){
  let t = document.getElementById('title').value;
  let p = document.getElementById('price').value;
  if(!uploadedURL) return alert('Pick a video from gallery first');
  if(!t ||!p) return alert('Fill title and price');
  
  videos.unshift({title:t, creator:"@"+currentUser, price:p, likes:0, src:uploadedURL});
  alert('Published! It will disappear after you close tab. Need backend to save forever.');
  document.getElementById('title').value = '';
  document.getElementById('price').value = '';
  go('home');
}

function loadStudio(){
  let mine = videos.filter(v=>v.creator=="@"+currentUser);
  let html = '';
  mine.forEach(v=>{ html += `<div class="card"><b>${v.title}</b> - ${v.price} π</div>`; });
  document.getElementById('studioList').innerHTML = html || "<div class='card'>No videos yet</div>";
}

async function doLogin(){
  try{
    const auth = await Pi.authenticate(['username']);
    currentUser = auth.user.username;
    document.getElementById('user').innerText = "@" + currentUser;
    alert("Logged in as @" + currentUser);
  }catch(e){
    alert("Login failed. Use Pi Browser");
  }
}

loadFeed();
</script>
</body>
</html>
