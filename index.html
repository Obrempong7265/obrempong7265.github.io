
<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:Arial; }
   .top { position:fixed; top:0; width:100%; background:#111; padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:99; }
   .login { background:#ff0050; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; width:auto; }
   .page { display:none; padding-top:60px; padding-bottom:70px; }
   .page.active { display:block; }
    video { width:100%; }
   .video-box { position:relative; margin-bottom:20px; background:#000; }
   .info { position:absolute; bottom:10px; left:10px; }
   .actions { position:absolute; right:10px; bottom:40px; text-align:center; }
   .actions button { background:none; border:none; color:#fff; font-size:28px; display:block; margin:10px 0; }
   .nav { position:fixed; bottom:0; width:100%; display:flex; background:#111; }
   .nav button { flex:1; padding:12px; background:none; border:none; color:#888; }
   .nav button.active { color:#ff0050; }
   .card { background:#222; margin:10px; padding:15px; border-radius:10px; }
    input { width:100%; padding:10px; margin:8px 0; background:#333; border:none; border-radius:5px; color:#fff; }
   .btn { width:100%; padding:12px; background:#ff0050; color:#fff; border:none; border-radius:8px; }
  </style>
</head>
<body>
  <div class="top">
    <h3>Video City</h3>
    <button class="login" onclick="login()">Login</button>
  </div>

  <div id="home" class="page active"><div id="feed"></div></div>

  <div id="upload" class="page">
    <div class="card">
      <h2>Upload</h2>
      <input type="file" id="file" accept="video/*">
      <input id="title" placeholder="Title">
      <input id="price" type="number" step="0.1" placeholder="Price in Pi">
      <button class="btn" onclick="publish()">Publish</button>
    </div>
  </div>

  <div id="studio" class="page"><div class="card"><h2>Studio</h2></div><div id="myvids"></div></div>
  <div id="profile" class="page"><div class="card"><h2>Profile</h2><p id="uname">Not logged in</p></div></div>

  <div class="nav">
    <button class="active" onclick="show('home')">Home</button>
    <button onclick="show('upload')">Upload</button>
    <button onclick="show('studio')">Studio</button>
    <button onclick="show('profile')">Profile</button>
  </div>

<script>
try{ Pi.init({version:"2.0", sandbox:true}) }catch(e){}
let user = "Guest";
let vids = JSON.parse(localStorage.getItem('vids')) || [
  {title:"Demo", creator:"@system", price:1, likes:0, src:"https://www.w3schools.com/html/mov_bbb.mp4"}
];

function save(){ localStorage.setItem('vids', JSON.stringify(vids)) }

function show(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  event.target.classList.add('active');
  if(p=='home') loadFeed();
  if(p=='studio') loadStudio();
}

function loadFeed(){
  let html = '';
  vids.forEach((v,i)=>{
    html += `<div class="video-box">
      <video src="${v.src}" controls autoplay muted loop playsinline></video>
      <div class="info"><b>${v.title}</b><br>${v.creator} • ${v.price} π</div>
      <div class="actions">
        <button onclick="like(${i})">❤️</button><span>${v.likes}</span>
        <button onclick="alert('Pay ${v.price} π')">💰</button>
