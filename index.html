
      <!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
    body { background:#000; color:#fff; font-size:14px; }
   .top-bar { position:fixed; top:0; width:100%; background:#111; padding:10px 15px; z-index:1000; display:flex; justify-content:space-between; align-items:center; }
   .top-actions { display:flex; gap:15px; align-items:center; }
   .notif-btn { position:relative; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
   .notif-dot { position:absolute; top:0; right:0; width:8px; height:8px; background:red; border-radius:50%; display:none; }
   .login-btn { background:#ff0050; border:none; color:#fff; padding:6px 12px; border-radius:8px; font-size:12px; font-weight:bold; }
    
   .page { display:none; padding:60px 0 80px 0; }
   .page.active { display:block; }
   .video-wrapper { position:relative; height:calc(100vh - 140px); }
   .video-wrapper video { width:100%; height:100%; object-fit:cover; }
   .side-actions { position:absolute; right:10px; bottom:100px; display:flex; flex-direction:column; gap:20px; text-align:center; z-index:999; }
   .action-btn { background:none; border:none; color:#fff; font-size:28px; cursor:pointer; }
   .action-btn.liked { color:#ff0050; }
   .sound-btn { position:absolute; top:20px; right:10px; background:rgba(0,0,0,0.6); border:none; color:#fff; padding:8px; border-radius:50%; font-size:18px; z-index:999; }
   .video-info { position:absolute; bottom:90px; left:15px; right:80px; z-index:999; }
   .bottom-nav { position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; background:#111; padding:6px 0; border-top:1px solid #222; z-index:1000; }
   .nav-btn { background:none; border:none; color:#888; font-size:12px; text-align:center; cursor:pointer; }
   .nav-btn.active { color:#ff0050; }
   .nav-icon { font-size:20px; display:block; }
    
    /* NOTIFICATIONS */
   .notif-item { background:#222; padding:12px; margin:10px 15px; border-radius:10px; display:flex; gap:10px; }
   .notif-item.unread { border-left:3px solid #ff0050; }
   .notif-icon { font-size:20px; }
    
   .comments { position:fixed; bottom:70px; left:0; width:100%; height:60%; background:#222; border-radius:20px 20px 0 0; padding:15px; display:none; z-index:2000; overflow-y:scroll; }
   .comments.active { display:block; }
   .close-x { float:right; font-size:24px; cursor:pointer; }
   .grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:10px; }
   .grid-item { aspect-ratio:9/16; background:#222; border-radius:8px; overflow:hidden; position:relative; }
  </style>
</head>
<body>
  <!-- TOP BAR WITH NOTIFICATION BELL -->
  <div class="top-bar">
    <h3>Video City</h3>
    <div class="top-actions">
      <button class="notif-btn" onclick="showPage('notifications')">🔔<span class="notif-dot" id="notifDot"></span></button>
      <button class="login-btn" onclick="login()">Login</button>
    </div>
  </div>
  
  <!-- HOME -->
  <div class="page active" id="home"><div id="feed"></div></div>
  
  <!-- UPLOAD -->
  <div class="page" id="upload"><h2 style="padding:15px;">➕ Upload</h2>...</div>
  
  <!-- STUDIO -->
  <div class="page" id="studio"><h2 style="padding:15px;">🛠️ Studio</h2><div id="myVideos"></div></div>
  
  <!-- EARNINGS -->
  <div class="page" id="earnings"><h2 style="padding:15px;">💰 Earnings</h2>...</div>
  
  <!-- PROFILE -->
  <div class="page" id="profile">
    <h2 style="padding:15px;">👤 Profile</h2>
    <p style="padding:0 15px;" id="profile-user">Not logged in</p>
    <h3 style="padding:15px;">My Videos</h3>
    <div id="myProfileVideos" class="grid"></div>
  </div>
  
  <!-- NEW: NOTIFICATIONS PAGE -->
  <div class="page" id="notifications">
    <h2 style="padding:15px;">🔔 Notifications</h2>
    <div id="notifList"></div>
  </div>

  <div class="comments" id="commentsBox">
    <h3>Comments <span class="close-x" onclick="closeComments()">×</span></h3>
    <div id="commentsList"></div>
    <input class="comment-input" id="commentInput" placeholder="Add comment... Enter to post" style="width:100%; padding:10px; background:#333; border:none; border-radius:20px; color:#fff;">
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="showPage('home')"><span class="nav-icon">🏠</span><span>Home</span></button>
    <button class="nav-btn" onclick="showPage('upload')"><span class="nav-icon">⬆️</span><span>Upload</span></button>
    <button class="nav-btn" onclick="showPage('studio')"><span class="nav-icon">🛠️</span><span>Studio</span></button>
    <button class="nav-btn" onclick="showPage('earnings')"><span class="nav-icon">💰</span><span>Earnings</span></button>
    <button class="nav-btn" onclick="showPage('profile')"><span class="nav-icon">👤</span><span>Profile</span></button>
  </div>

  <script>
    Pi.init({ version: "2.0", sandbox: "true" });
    let currentUser = "Guest";
    let videos = JSON.parse(localStorage.getItem('videos')) || [
      {id:1, title:"Demo", creator:"@creator1", price:1, likes:0, likedBy:[], views:0, comments:[], src:"https://www.w3schools.com/html/mov_bbb.mp4"}
    ];
    let notifications = JSON.parse(localStorage.getItem('notifs')) || [];
    let currentVideoId = 1;
    
    function saveData() { 
      localStorage.setItem('videos', JSON.stringify(videos));
      localStorage.setItem('notifs', JSON.stringify(notifications));
    }
    
    function addNotification(toUser, type, text) {
      if(toUser === "@"+currentUser) return; // don't notify yourself
      notifications.unshift({
        id: Date.now(),
        to: toUser,
        type: type, // 'like', 'comment', 'tip'
        text: text,
        time: "Just now",
        read: false
      });
      saveData();
      updateNotifDot();
    }
    
    function updateNotifDot() {
      let unread = notifications.filter(n => n.to === "@"+currentUser && !n.read).length;
      document.getElementById('notifDot').style.display = unread > 0 ? 'block' : 'none';
    }
    
    function renderNotifications() {
      let userNotifs = notifications.filter(n => n.to === "@"+currentUser);
      let html = '';
      userNotifs.forEach(n => {
        let icon = n.type==='like'?'❤️': n.type==='comment'?'💬':'💰';
        html += `<div class="notif-item ${n.read?'':'unread'}" onclick="markRead(${n.id})">
          <div class="notif-icon">${icon}</div>
          <div><b>${n.text}</b><br><span style="font-size:11px; color:#aaa;">${n.time}</span></div>
        </div>`;
      });
      document.getElementById('notifList').innerHTML = html || "<p style='padding:15px;'>No notifications yet</p>";
      userNotifs.forEach(n => n.read = true); // mark as read when opened
      saveData(); updateNotifDot();
    }
    
    function markRead(id) {
      notifications.find(n=>n.id===id).read = true;
      saveData();
    }
    
    function showPage(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if(id === 'notifications') renderNotifications();
      if(id === 'home') renderFeed();
      if(id === 'profile') renderProfile();
    }
    
    function renderFeed() {
      let html = '';
      videos.forEach(v => {
        let liked = v.likedBy.includes(currentUser);
        html += `<div class="video-wrapper">
          <video id="vid${v.id}" src="${v.src}" autoplay loop muted playsinline></video>
          <button class="sound-btn" onclick="toggleSound(${v.id})">🔇</button>
          <div class="side-actions">
            <button class="action-btn ${liked?'liked':''}" onclick="like(${v.id})">❤️</button><div>${v.likes}</div>
            <button class="action-btn" onclick="openComments(${v.id})">💬</button><div>${v.comments.length}</div>
            <button class="action-btn" onclick="payVideo(${v.id}, ${v.price})">💰</button><div>${v.price}π</div>
          </div>
          <div class="video-info"><h4>${v.title}</h4><p>${v.creator}</p></div>
        </div>`;
      });
      document.getElementById('feed').innerHTML = html;
    }
    
    function toggleSound(id) {
      let vid = document.getElementById('vid'+id);
      vid.muted =!vid.muted;
      event.target.innerText = vid.muted? '🔇' : '🔊';
    }
    
    // LIKE + SEND NOTIFICATION
    function like(id) { 
      let v = videos.find(v => v.id === id);
      if(v.likedBy.includes(currentUser)) {
        v.likes--; v.likedBy = v.likedBy.filter(u => u !== currentUser);
      } else {
        v.likes++; v.likedBy.push(currentUser);
        addNotification(v.creator, 'like', `@${currentUser} liked your video "${v.title}"`);
      }
      saveData(); renderFeed(); 
    }
    
    function openComments(id) { /* same as before */ }
    function closeComments() { document.getElementById('commentsBox').classList.remove('active'); }
    
    function addComment() {
      let text = document.getElementById('commentInput').value;
      if(!text) return;
      let v = videos.find(v => v.id === currentVideoId);
      v.comments.push({user:currentUser, text:text, replies:[]});
      addNotification(v.creator, 'comment', `@${currentUser} commented: "${text}" on "${v.title}"`);
      document.getElementById('commentInput').value = '';
      saveData(); openComments(currentVideoId);
    }
    
    function payVideo(id, price) {
      let v = videos.find(v => v.id === id);
      Pi.createPayment({amount: price, memo: "Video " + id}, {
        onReadyForServerCompletion: function(paymentId, txid) { 
          addNotification(v.creator, 'tip', `@${currentUser} tipped you ${price} π for "${v.title}"`);
          alert("Paid " + price + " π! Creator notified.") 
        }
      });
    }
    
    async function login() {
      const auth = await Pi.authenticate(['username', 'payments']);
      currentUser = auth.user.username;
      document.getElementById("profile-user").innerText = "@" + currentUser;
      updateNotifDot();
    }
    
    function renderProfile() { /* same grid code */ }
    
    document.getElementById('commentInput').onkeypress = function(e){ if(e.key==='Enter') addComment() }
    renderFeed(); updateNotifDot();
  </script>
</body>
</html>
