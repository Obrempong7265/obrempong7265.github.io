<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; color:#fff; font-family:Arial; }
.top { position:fixed; top:0; width:100%; background:#111; padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:99; }
.login { background:#ff0050; color:#fff; border:none; padding:8px 16px; border-radius:8px; font-weight:bold; }
.page { display:none; padding-top:60px; padding-bottom:70px; }
.page.active { display:block; }
.video-box { background:#111; margin:10px; border-radius:12px; overflow:hidden; }
.cover { position:relative; background:#000; width:100%; aspect-ratio:9/16; }
.cover video,.cover.thumb { width:100%; height:100%; object-fit:cover; }
.pay-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:5; }
.pay-overlay button { background:#ff0050; color:#fff; border:none; padding:14px 28px; border-radius:10px; font-size:16px; font-weight:bold; margin-top:10px; }
.info { padding:10px; }
.actions { display:flex; gap:25px; padding:0 10px 10px; }
.actions button { background:none; border:none; color:#fff; font-size:22px; display:flex; align-items:center; gap:5px; }
.actions button.liked { color:#ff0050; }
.nav { position:fixed; bottom:0; width:100%; display:flex; background:#111; }
.nav button { flex:1; padding:12px; background:none; border:none; color:#888; }
.nav button.active { color:#ff0050; }
.card { background:#222; margin:10px; padding:15px; border-radius:10px; text-align:center; color:#888; }
input { width:100%; padding:10px; margin:8px 0; background:#333; border:none; border-radius:5px; color:#fff; }
.btn { width:100%; padding:12px; background:#ff0050; color:#fff; border:none; border-radius:8px; }
/* COMMENT MODAL TIKTOK STYLE */
.modal { display:none; position:fixed; bottom:0; left:0; width:100%; height:75%; background:#121212; border-radius:20px 20px 0 0; z-index:100; flex-direction:column; }
.modal.active { display:flex; }
.modal-header { padding:15px; display:flex; justify-content:space-between; border-bottom:1px solid #333; }
.comments-list { flex:1; overflow-y:auto; padding:10px; }
.comment { margin-bottom:15px; }
.comment-user { font-weight:bold; font-size:13px; }
.comment-text { font-size:14px; margin:3px 0; }
.reply-btn { font-size:12px; color:#aaa; background:none; border:none; }
.comment-input { display:flex; gap:8px; padding:10px; border-top:1px solid #333; }
.comment-input input { flex:1; background:#333; border:none; color:#fff; padding:10px; border-radius:20px; }
.comment-input button { background:#ff0050; border:none; color:#fff; padding:10px 18px; border-radius:20px; font-weight:bold; }
  </style>
</head>
<body>
  <div class="top">
    <h3>Video City</h3>
    <button class="login" onclick="login()">Login</button>
  </div>

  <div id="home" class="page active"><div id="feed"></div></div>
  <div id="upload" class="page"><div class="card"><h2>Upload</h2><input type="file" id="file" accept="video/*"><input id="title" placeholder="Title"><input id="price" type="number" step="0.1" placeholder="Price in Pi"><button class="btn" onclick="publish()">Publish</button></div></div>
  <div id="studio" class="page"><div class="card"><h2>Studio</h2><p>Analytics coming after payment</p></div></div>
  <div id="profile" class="page"><div class="card"><h2>Profile</h2><p id="uname">Not logged in</p></div><div id="myvids"></div></div>

  <div class="nav">
    <button class="active" onclick="show('home')">Home</button>
    <button onclick="show('upload')">Upload</button>
    <button onclick="show('studio')">Studio</button>
    <button onclick="show('profile')">Profile</button>
  </div>

  <!-- COMMENT MODAL -->
  <div id="commentModal" class="modal">
    <div class="modal-header">
      <h3>Comments</h3>
      <button onclick="closeComments()" style="background:none;border:none;color:#fff;font-size:24px;">X</button>
    </div>
    <div class="comments-list" id="modalComments"></div>
    <div class="comment-input">
      <input id="modalCommentInput" placeholder="Add comment">
      <button onclick="postModalComment()">Post</button>
    </div>
  </div>

<script>
try{ Pi.init({version:"2.0", sandbox:true}) }catch(e){}
let user = "Guest";

// FIX 1: CLEAR CORRUPTED DATA ONCE
if(!localStorage.getItem('v34_fix')){
  localStorage.removeItem('vids');
  localStorage.removeItem('liked');
  localStorage.removeItem('paid');
  localStorage.setItem('v34_fix','done');
}

let likedVideos = JSON.parse(localStorage.getItem('liked')) || [];
let paidVideos = JSON.parse(localStorage.getItem('paid')) || [];
let vids = JSON.parse(localStorage.getItem('vids')) || []; // start empty
let activeCommentVideo = null;
let replyingTo = null;

function save(){ 
  localStorage.setItem('vids', JSON.stringify(vids));
  localStorage.setItem('liked', JSON.stringify(likedVideos));
  localStorage.setItem('paid', JSON.stringify(paidVideos));
}

function show(p){
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));
  document.getElementById(p).classList.add('active');
  event.target.classList.add('active');
  if(p=='home') loadFeed();
  if(p=='profile') loadProfile();
}

function loadFeed(){
  if(vids.length === 0){
    document.getElementById('feed').innerHTML = `<div class="card">No videos yet. Be the first to upload!</div>`;
    return;
  }
  let html = '';
  vids.forEach((v,i)=>{
    let isLiked = likedVideos.includes(i);
    let isPaid = v.price == 0 || v.creator == "@"+user || paidVideos.includes(i);
    let commentCount = v.comments.length + v.comments.reduce((a,c)=>a+(c.replies?c.replies.length:0),0);
    
    html += `<div class="video-box">
      <div class="cover">
        ${isPaid? 
          `<video src="${v.src}" controls playsinline></video>` :
          `<div class="thumb"></div>
           <div class="pay-overlay">
             <h3>🔒 ${v.price} π</h3>
             <p>Pay to watch</p>
             <button onclick="buyVideo(${i})">Unlock Now</button>
           </div>`
        }
      </div>
      <div class="info"><b>${v.title}</b><br>${v.creator} • ${v.price} π</div>
      <div class="actions">
        <button class="${isLiked? 'liked' : ''}" onclick="toggleLike(${i})">❤️ ${v.likes}</button>
        <button onclick="openComments(${i})">💬 ${commentCount}</button>
      </div>
    </div>`;
  });
  document.getElementById('feed').innerHTML = html;
}

function buyVideo(i){
  alert("Pi Payment coming next. For now unlocked.");
  if(!paidVideos.includes(i)) paidVideos.push(i);
  save();
  loadFeed();
}

function toggleLike(i){
  let idx = likedVideos.indexOf(i);
  if(idx > -1){ likedVideos.splice(idx,1); if(vids[i].likes > 0) vids[i].likes--; } 
  else { likedVideos.push(i); vids[i].likes++; }
  save(); loadFeed();
}

function openComments(i){
  activeCommentVideo = i;
  replyingTo = null;
  document.getElementById('modalCommentInput').placeholder = "Add comment";
  document.getElementById('commentModal').classList.add('active');
  renderModalComments();
}

function closeComments(){
  document.getElementById('commentModal').classList.remove('active');
}

function replyTo(commentIndex){
  replyingTo = commentIndex;
  document.getElementById('modalCommentInput').placeholder = "Reply to @" + vids[activeCommentVideo].comments[commentIndex].user.replace('@','');
  document.getElementById('modalCommentInput').focus();
}

function renderModalComments(){
  let v = vids[activeCommentVideo];
  let html = '';
  v.comments.forEach((c,ci)=>{
    html += `<div class="comment">
      <div class="comment-user">${c.user}</div>
      <div class="comment-text">${c.text}</div>
      <button class="reply-btn" onclick="replyTo(${ci})">Reply</button>`;
    if(c.replies) c.replies.forEach(r=>{
      html += `<div style="margin-left:20px;margin-top:5px;">
        <div class="comment-user">${r.user}</div>
        <div class="comment-text">${r.text}</div>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('modalComments').innerHTML = html || "<p style='text-align:center;color:#888;'>No comments yet</p>";
}

function postModalComment(){
  let txt = document.getElementById('modalCommentInput').value;
  if(!txt) return;
  let v = vids[activeCommentVideo];
  if(!v.comments[replyingTo].replies) v.comments[replyingTo].replies = [];
  if(replyingTo!== null){
    v.comments[replyingTo].replies.push({user:"@"+user, text:txt});
    replyingTo = null;
  } else {
    v.comments.push({user:"@"+user, text:txt, replies:[]});
  }
  document.getElementById('modalCommentInput').value = '';
  document.getElementById('modalCommentInput').placeholder = "Add comment";
  save(); renderModalComments(); loadFeed();
}

document.getElementById('file').onchange = e => { window.fileURL = URL.createObjectURL(e.target.files[0]); }

function publish(){
  let t = document.getElementById('title').value;
  let p = document.getElementById('price').value;
  if(!window.fileURL) return alert('Pick video');
  if(!t ||!p) return alert('Fill all');
  vids.unshift({title:t, creator:"@"+user, price:parseFloat(p), likes:0, comments:[], src:window.fileURL});
  save(); 
  alert('Published!'); 
  document.getElementById('title').value = '';
  document.getElementById('price').value = '';
  document.getElementById('file').value = '';
  loadFeed(); // FIX 2: REFRESH FEED
  show('home');
}

function loadProfile(){
  document.getElementById('uname').innerText = "@" + user;
  let mine = vids.filter(v=>v.creator=="@"+user);
  document.getElementById('myvids').innerHTML = mine.map(v=>`<div class="card" style="text-align:left;"><video src="${v.src}" controls style="height:200px;width:100%;"></video><b>${v.title}</b> - ${v.price} π - ❤️ ${v.likes}</div>`).join('') || "<div class='card'>No videos yet</div>";
}

async function login(){
  try{ let auth = await Pi.authenticate(['username']); user = auth.user.username; document.getElementById('uname').innerText = "@" + user; alert("Welcome @" + user); loadProfile(); loadFeed(); }
  catch(e){ alert("Login failed. Add domain in Pi Dev Portal"); }
}

loadFeed();
</script>
</body>
</html>
