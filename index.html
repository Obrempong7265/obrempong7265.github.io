

<!DOCTYPE html>
<html>
<head>
  <title>Video City</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, sans-serif; }
    body { background:#000; color:#fff; }
   .top-bar { position:fixed; top:0; width:100%; background:rgba(0,0,0,0.4); padding:10px 15px; display:flex; justify-content:space-between; align-items:center; z-index:100; }
   .login-btn { background:#ff0050; border:none; color:#fff; padding:6px 12px; border-radius:8px; font-weight:bold; }
   .notif-btn { position:relative; background:none; border:none; color:#fff; font-size:24px; }
    
   .page { display:none; padding-top:60px; padding-bottom:70px; }
   .page.active { display:block; }
    
    /* FULLSCREEN VIDEO */
   .video-wrapper { position:relative; height:calc(100vh - 130px); background:#000; }
   .video-wrapper video { width:100%; height:100%; object-fit:cover; }
    
    /* SIDE BUTTONS */
   .side-actions { position:absolute; right:10px; bottom:90px; display:flex; flex-direction:column; gap:18px; text-align:center; z-index:99; }
   .action-btn { background:none; border:none; color:#fff; font-size:32px; cursor:pointer; }
   .action-btn.liked { color:#ff0050; }
   .action-count { font-size:12px; font-weight:bold; margin-top:-5px; }
    
    /* VIDEO INFO BOTTOM */
   .video-info { position:absolute; bottom:80px; left:15px; right:80px; }
   .video-info h4 { font-size:16px; font-weight:bold; }
   .video-info p { font-size:13px; color:#ccc; }
    
   .bottom-nav { position:fixed; bottom:0; width:100%; display:flex; justify-content:space-around; background:#111; padding:8px 0; border-top:1px solid #222; }
   .nav-btn { background:none; border:none; color:#888; font-size:11px; text-align:center; }
   .nav-btn.active { color:#ff0050; }
   .nav-icon { font-size:22px; display:block; }
    
   .card { background:#222; padding:15px; margin:10px; border-radius:10px; }
   .form-input { width:100%; padding:10px; margin:8px 0; background:#333; border:none; border-radius:8px; color:#fff; }
   .btn { width:100%; padding:12px; background:#ff0050; border:none; color:#fff; border-radius:8px; font-weight:bold; }
   .grid { display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:2px; }
   .grid-item { aspect-ratio:9/16; }
   .grid-item video { width:100%; height:100%; object-fit:cover; }
    
    /* COMMENTS POPUP */
   .comments { position:fixed; bottom:70px; left:0; width:100%; height:50%; background:#222; border-radius:20px 20px 0 0; padding:15px; display:none; z-index:200; overflow-y:scroll; }
   .comments.active { display:block; }
   .close-x { float:right; font-size:24px; cursor:pointer; }
   .comment { background:#333; padding:8px; margin:5px 0; border-radius:8px; font-size:13px; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h3>Video City</h3>
    <div>
      <button class="notif-btn" onclick="show('notifications')">🔔</button>
      <button class="login-btn" onclick="login()">Login</button>
    </div>
  </div>
  
  <div class="page active" id="home"><div id="feed"></div></div>
  
  <div class="page" id="upload">
    <h2 style="padding:15px;">Upload Video</h2>
    <div class="card">
      <input type="file" id="videoFile" accept="video/*" onchange="previewVideo(event)">
      <p id="fileName" style="margin:10px 0; color:#aaa;">No file chosen</p>
      <video id="preview" width="100%" style="display:none; border-radius:10px;" controls></video>
      <input id="videoTitle" class="form-input" placeholder="Video Title">
      <input id="videoPrice" class="form-input" type="number" step="0.1" placeholder="Price in Pi">
      <button onclick="publishVideo()" class="btn">Publish</button>
    </div>
  </div>
  
  <div class="page" id="studio"><h2 style="padding:15px;">Studio</h2><div id="myVideos"></div></div>
  <div class="page" id="earnings"><h2 style="padding:15px;">Earnings</h2><div class="card">Total: 0 π</div></div>
  <div class="page" id="profile"><h2 style="padding:15px;">Profile</h2><div class="card" id="profile-user">Not logged in</div><div id="myProfileVideos" class="grid"></div></div>
  <div class="page" id="notifications"><h2 style="padding:15px;">Notifications</h2><div class="card">No notifications</div></div>

  <!-- COMMENTS POPUP -->
  <div class="comments" id="commentsBox">
    <h3>Comments <span class="close-x" onclick="closeComments()">×</span></h3>
    <div id="commentsList"></div>
    <input class="form-input" id="commentInput" placeholder="Add comment... Press Enter">
  </div>

  <div class="bottom-nav">
    <button class="nav-btn active" onclick="show('home')"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-btn" onclick="show('upload')"><span class="nav-icon">⬆️</span>Upload</button>
    <button class="nav-btn" onclick="show('studio')"><span class="nav-icon">🛠️</span>Studio</button>
    <button class="nav-btn" onclick="show('earnings')"><span class="nav-icon">💰</span>Earnings</button>
    <button class="nav-btn" onclick="show('profile')"><span class="nav-icon">👤</span>Profile</button>
  </div>

  <script>
    try { Pi.init({ version: "2.0", sandbox: "true" }); } catch(e){} 
    let currentUser = "Guest";
    let videos = JSON.parse(localStorage.getItem('videos')) || [
      {id:1, title:"Couple", creator:"@OBREMPONG7", price:2, likes:0, likedBy:[], views:0, comments:[], src:"https://www.w3schools.com/html/mov_bbb.mp4"}
    ];
    let currentVideoId = 1;
    let uploadedFileURL = "";
    
    function saveVideos() { localStorage.setItem('videos', JSON.stringify(videos)); }
    
    function show(id) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      event.target.closest('.nav-btn').classList.add('active');
      if(id === 'home') renderFeed();
      if(id === 'studio') renderStudio();
      if(id === 'profile') renderProfile();
    }
    
    function renderFeed() {
      let html = '';
      videos.forEach(v => {
        let liked = v.likedBy.includes(currentUser);
        html += `<div class="video-wrapper">
          <video src="${v.src}" autoplay loop muted playsinline></video>
          <div class="side-actions">
            <div><button class="action-btn ${liked?'liked':''}" onclick="like(${v.id})">❤️</button><div class="action-count">${v.likes}</div></div>
            <div><button class="action-btn" onclick="openComments(${v.id})">💬</button><div class="action-count">${v.comments.length}</div></div>
            <div><button class="action-btn" onclick="pay(${v.id}, ${v.price})">💰</button><div class="action-count">${v.price}π</div></div>
          </div>
          <div class="video-info">
            <h4>${v.title}</h4>
            <p>${v.creator} • ${v.price} π</p>
          </div>
        </div>`;
      });
      document.getElementById('feed').innerHTML = html;
    }
    
    function like(id) {
      let v = videos.find(v=>v.id===id);
      if(v.likedBy.includes(currentUser)) { 
        v.likes--; v.likedBy = v.likedBy.filter(u=>u!==currentUser); 
      } else { 
        v.likes++; v.likedBy.push(currentUser); 
      }
      saveVideos(); renderFeed();
    }
    
    function openComments(id) {
      currentVideoId = id;
      let v = videos.find(v=>v.id===id);
      let html = v.comments.map(c=>`<div class="comment"><b>@${c.user}:</b> ${c.text}</div>`).join('');
      document.getElementById('commentsList').innerHTML = html || "<p>No comments yet</p>";
      document.getElementById('commentsBox').classList.add('active');
    }
    function closeComments() { document.getElementById('commentsBox').classList.remove('active'); }
    
    document.getElementById('commentInput').onkeypress = function(e){ 
      if(e.key==='Enter'){
        let text = e.target.value;
        if(!text) return;
        videos.find(v=>v.id===currentVideoId).comments.push({user:currentUser, text:text});
        e.target.value = '';
        saveVideos(); openComments(currentVideoId);
      }
    }
    
    function pay(id, price) {
      Pi.createPayment({amount:price, memo:"Video "+id}, { 
        onReadyForServerCompletion: function() { alert("Sent "+price+" π to creator!") } 
      });
    }
    
    function previewVideo(event) { /* same */ }
    function publishVideo() { /* same */ }
    function renderStudio() { /* same */ }
    function renderProfile() { /* same */ }
    async function login() { const auth = await Pi.authenticate(['username']); currentUser = auth.user.username; document.getElementById("profile-user").innerText = "@" + currentUser; }
    
    renderFeed();
  </script>
</body>
</html>
