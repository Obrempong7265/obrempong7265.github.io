<template id="videoTemplate">


    <article class="video-card">


        <!-- VIDEO -->

        <div class="video-wrap">


            <video
                class="video"
                controls
                playsinline
                preload="metadata">
            </video>



            <!-- LOCKED VIDEO -->

            <div
                class="lock-overlay hidden">


                <div>


                    <strong>
                        Locked Video
                    </strong>


                    <p class="price">
                    </p>


                    <button
                        class="btn pink unlockBtn">

                        Unlock with Pi

                    </button>


                </div>

            </div>

        </div>



        <!-- VIDEO INFORMATION -->

        <div class="video-info">


            <h3 class="title">
            </h3>


            <p class="creator">
            </p>


            <p class="description">
            </p>



            <!-- ACTIONS -->

            <div class="actions">


                <button class="likeBtn">

                    ♡

                    <span>
                        0
                    </span>

                </button>


                <button class="commentBtn">

                    💬

                    <span>
                        Comment
                    </span>

                </button>


                <button class="replyBtn">

                    ↩ Reply

                </button>


            </div>



            <!-- COMMENTS -->

            <div class="comments hidden">


                <form class="commentForm">


                    <input
                        name="text"
                        maxlength="500"
                        placeholder="Write a comment..."
                        required>


                    <button
                        class="btn"
                        type="submit">

                        Post

                    </button>


                </form>


                <div class="commentList">
                </div>


            </div>

        </div>

    </article>

</template>
