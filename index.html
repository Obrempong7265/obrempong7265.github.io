<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Video City</title>

<!-- Pi SDK -->
<script src="https://sdk.minepi.com/pi-sdk.js"></script>

<!-- Initialize Pi SDK -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (typeof Pi !== "undefined") {
            Pi.init({
                version: "2.0"
            });

            console.log("Pi SDK initialized successfully.");
        } else {
            console.error("Pi SDK was not found.");
        }
    });
</script>

<!-- Video City Styling -->
<link rel="stylesheet" href="styles.css">

</head><body><!-- TOP HEADER -->
<header class="topbar">

    <div class="brand">
        <span class="logo">▶</span>
        <span>Video City</span>
    </div>

    <div class="account">
        <span id="piUser" class="username">
            Not connected
        </span>

        <button
            id="loginBtn"
            class="btn pink">
            Login with Pi
        </button>
    </div>

</header>


<!-- MAIN CONTENT -->
<main>

    <section id="feed" class="feed">
        <!-- Videos will be loaded here by app.js -->
    </section>


    <!-- CREATOR STUDIO -->
    <section id="studio" class="panel hidden">

        <h2>Creator Studio</h2>

        <p class="muted">
            Subscribe to a creator plan before uploading videos.
        </p>

        <div id="plans" class="plans">

            <div class="plan">
                <h3>Weekly</h3>
                <p>Creator access for 7 days</p>

                <button
                    class="btn pink"
                    data-plan="weekly">
                    Subscribe
                </button>
            </div>

            <div class="plan">
                <h3>Monthly</h3>
                <p>Creator access for 30 days</p>

                <button
                    class="btn pink"
                    data-plan="monthly">
                    Subscribe
                </button>
            </div>

            <div class="plan">
                <h3>Yearly</h3>
                <p>Creator access for 365 days</p>

                <button
                    class="btn pink"
                    data-plan="yearly">
                    Subscribe
                </button>
            </div>

        </div>


        <!-- VIDEO UPLOAD -->
        <div class="upload-box">

            <h3>Upload Video</h3>

            <form id="uploadForm">

                <input
                    type="text"
                    name="title"
                    placeholder="Video title"
                    maxlength="120"
                    required>

                <textarea
                    name="description"
                    placeholder="Video description"
                    maxlength="1000">
                </textarea>

                <input
                    type="number"
                    name="price"
                    min="0.01"
                    step="0.01"
                    placeholder="Unlock price in Pi"
                    required>

                <input
                    type="file"
                    name="video"
                    accept="video/*"
                    required>

                <button
                    class="btn pink"
                    type="submit">
                    Upload Video
                </button>

            </form>

            <p id="uploadStatus" class="muted"></p>

        </div>

    </section>

</main>


<!-- BOTTOM NAVIGATION -->
<nav class="bottom-nav">

    <button data-view="home" class="nav active">
        Home
    </button>

    <button data-view="studio" class="nav">
        Upload
    </button>

    <button data-view="studio" class="nav">
        Studio
    </button>

    <button data-view="profile" class="nav">
        Profile
    </button>

</nav>


<!-- VIDEO TEMPLATE -->
<template id="videoTemplate">

    <article class="video-card">

        <div class="video-wrap">

            <video
                class="video"
                controls
                playsinline
                preload="metadata">
            </video>

            <div class="lock-overlay hidden">

                <div>
                    <strong>Locked Video</strong>

                    <p class="price"></p>

                    <button
                        class="btn pink unlockBtn">
                        Unlock with Pi
                    </button>
                </div>

            </div>

        </div>


        <div class="video-info">

            <h3 class="title"></h3>

            <p class="creator"></p>

            <p class="description"></p>

            <div class="actions">

                <button class="likeBtn">
                    ♡
                    <span>0</span>
                </button>

                <button class="commentBtn">
                    💬
                    <span>Comment</span>
                </button>

                <button class="replyBtn">
                    ↩ Reply
                </button>

            </div>


            <div class="comments hidden">

                <form class="commentForm">

                    <input
                        name="text"
                        maxlength="500"
                        placeholder="Write a comment..."
                        required>

                    <button
                        class="btn"
                        type="submit">
                        Post
                    </button>

                </form>

                <div class="commentList"></div>

            </div>

        </div>

    </article>

</template>


<!-- VIDEO CITY JAVASCRIPT FILES -->

<script src="config.js"></script>
<script src="app.js"></script>

<!-- Pi Login -->
<script src="login.js"></script>

</body>
</html>
