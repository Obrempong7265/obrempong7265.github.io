
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Video City - Sandbox Test</title>
</head>
<body style="background:#111;color:white;font-family:Arial,sans-serif;padding:20px;">

    <h2>Video City - Sandbox Test</h2>
    <p id="status">Loading Pi SDK...</p>
    <button id="loginBtn" type="button">Authenticate with Pi</button>
    <pre id="result" style="white-space:pre-wrap;"></pre>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
    (async function () {
        const status = document.getElementById("status");
        const result = document.getElementById("result");
        const loginBtn = document.getElementById("loginBtn");

        if (typeof Pi === "undefined") {
            status.textContent = "Pi SDK not found. Open this page in Pi Browser.";
            loginBtn.disabled = true;
            return;
        }

        try {
            await Pi.init({
                version: "2.0",
                sandbox: true
            });
            status.textContent = "Sandbox SDK initialized. Ready to test.";
        } catch (error) {
            status.textContent = "SDK initialization failed.";
            result.textContent = error?.message || String(error);
            loginBtn.disabled = true;
            return;
        }

        loginBtn.addEventListener("click", async function () {
            loginBtn.disabled = true;
            status.textContent = "Authenticating...";
            result.textContent = "";

            try {
                const auth = await Pi.authenticate(
                    ["username", "payments", "wallet_address"],
                    function (payment) {
                        console.log("Incomplete payment:", payment);
                    }
                );

                status.textContent = "Authentication successful.";
                result.textContent =
                    "Username: " + (auth.user?.username || "Not returned") +
                    "\nWallet field returned: " +
                    ("wallet_address" in (auth.user || {})) +
                    "\nGranted scopes: " +
                    JSON.stringify(auth.user?.credentials?.scopes || []);

                result.textContent += "\n\nTesting wallet API...";

                try {
                    if (
                        !Pi.Wallet ||
                        typeof Pi.Wallet.getUserMigratedWalletAddresses !== "function"
                    ) {
                        result.textContent += "\nWallet API method unavailable.";
                    } else {
                        const walletResult =
                            await Pi.Wallet.getUserMigratedWalletAddresses();

                        const wallets = Array.isArray(walletResult?.wallets)
                            ? walletResult.wallets
                            : [];

                        result.textContent +=
                            "\nWallet API call succeeded." +
                            "\nWallets returned: " + wallets.length;
                    }
                } catch (walletError) {
                    result.textContent +=
                        "\nWallet API error: " +
                        (walletError?.message || String(walletError));
                }
            } catch (error) {
                status.textContent = "Authentication failed.";
                result.textContent = error?.message || String(error);
            } finally {
                loginBtn.disabled = false;
            }
        });
    })();
    </script>
</body>
</html>
